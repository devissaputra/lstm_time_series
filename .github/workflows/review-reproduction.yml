name: Review reproduction
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/review-reproduction.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  reproduce:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run complete corrected study
        run: PYTHONPATH=. python src/run_experiment.py
      - uses: actions/upload-artifact@v4
        with:
          name: review-reproduction-results
          path: results/
